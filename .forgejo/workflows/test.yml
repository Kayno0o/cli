name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']

jobs:
  test:
    runs-on: alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check, lint and test
        run: bun run check && bun run lint && bun run test
