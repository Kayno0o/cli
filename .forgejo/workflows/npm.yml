name: Publish

permissions:
  contents: read

on:
  push:
    tags:
      - '*-v*'

jobs:
  publish:
    runs-on: alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check, lint and test
        run: bun run check && bun run lint && bun run test

      # A tag ft-v0.3.0 builds and publishes packages/ft; cli-kit ships its source, so it has no build.
      - name: Publish to the Forgejo npm registry
        run: |
          trap 'rm -f ~/.npmrc' EXIT
          echo "@kaynooo:registry=https://git.kaynooo.fr/api/packages/kaynooo/npm/" > ~/.npmrc
          echo "//git.kaynooo.fr/api/packages/kaynooo/npm/:_authToken=${PACKAGE_TOKEN}" >> ~/.npmrc
          cd "packages/${TAG%-v*}"
          bun run --if-present build
          bun publish --access public
        env:
          TAG: ${{ github.ref_name }}
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      # The same tarball goes to npmjs: publishConfig.registry is pointed there for this run, so bun reads the token the way the Forgejo step above does.
      - name: Publish to npmjs
        run: |
          trap 'rm -f ~/.npmrc' EXIT
          test -n "${NPM_TOKEN}" || { echo "the NPM_TOKEN secret is empty"; exit 1; }
          echo "@kaynooo:registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          cd "packages/${TAG%-v*}"
          bun -e 'const f = Bun.file("package.json"); const p = await f.json(); p.publishConfig.registry = "https://registry.npmjs.org/"; await Bun.write(f, JSON.stringify(p, null, 2) + "\n")'
          bun publish --access public
        env:
          TAG: ${{ github.ref_name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
