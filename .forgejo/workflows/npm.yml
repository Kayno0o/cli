name: Publish

permissions:
  contents: read

on:
  push:
    tags:
      - '*-v*'

# The tests are not rerun here: `ft release` waits for the Tests run on main before the version bump, and the bump commit only changes versions.
jobs:
  publish:
    runs-on: alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: https://git.kaynooo.fr/kaynooo/actions/setup-bun@v1

      # A tag ft-v0.3.0 publishes packages/ft; cli-kit ships its source, so it has no build.
      - name: Find the package
        id: package
        run: echo "directory=packages/${TAG%-v*}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref_name }}

      - uses: https://git.kaynooo.fr/kaynooo/actions/npm-publish@v1
        with:
          working-directory: ${{ steps.package.outputs.directory }}
          token: ${{ secrets.PACKAGE_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}
